# Süper ERP - Production (tek komutla ayağa kalkma)
# Kullanım:
#   1. .env dosyasında JWT_SECRET ve isteğe bağlı DATABASE_PATH tanımlayın (bkz. .env.example)
#   2. docker-compose up -d --build
# Veritabanı ./data dizininde kalıcı olarak saklanır.

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/erp.db}
      - PORT=3000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
