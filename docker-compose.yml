version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    volumes:
      - ./data:/app/data

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    environment:
      NODE_ENV: production
      WORKER_COMMAND: "node -e \"console.log('Set WORKER_COMMAND to run a job')\""
    profiles:
      - jobs

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: super_erp
      POSTGRES_USER: super_erp
      POSTGRES_PASSWORD: super_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - db

volumes:
  postgres_data:
